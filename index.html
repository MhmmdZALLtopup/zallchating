<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZUX OFFICIAL - Global Chat & Call</title>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-header: #202c33;
            --wa-bubble-in: #202c33;
            --wa-bubble-out: #005c4b;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --primary: #00a884;
            --danger: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; height: 100dvh; overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--wa-bg); color: var(--text-main); 
        }

        /* Modal Login */
        #login-screen { 
            position: fixed; inset: 0; background: var(--wa-bg); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 10000; padding: 20px; 
        }
        .login-box { 
            background: var(--wa-header); padding: 30px 25px; 
            border-radius: 12px; text-align: center; width: 100%; max-width: 350px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .login-box input { 
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; 
            outline: none; margin-bottom: 20px; font-size: 16px; 
            background: #2a3942; color: white; text-align: center; 
        }
        .login-box button { 
            width: 100%; padding: 14px; background: var(--primary); color: #111b21; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; 
        }

        /* Layout Utama */
        #app-screen { 
            display: none; flex-direction: column; height: 100dvh; width: 100vw; position: relative; 
        }

        /* Header dengan Hamburger Menu */
        header { 
            background: var(--wa-header); padding: 10px 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            height: 60px; flex-shrink: 0; z-index: 10; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 5px; }
        .hamburger div { width: 22px; height: 2px; background: var(--text-main); border-radius: 2px;}
        .title { font-weight: 600; font-size: 1.15rem; letter-spacing: 0.5px; }
        .icon-btn-head { background: none; border: none; fill: var(--text-main); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }

        /* Area Chat */
        #chat-container { 
            flex: 1; padding: 15px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 12px; 
            background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 16px 16px; 
        }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; position: relative; }
        @media(min-width: 768px) { .message-wrapper { max-width: 60%; } }
        .message-wrapper.me { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }
        
        .sender-name { font-size: 0.75rem; color: #53bdeb; margin-bottom: 4px; margin-left: 4px; font-weight: 600; }
        .message-wrapper.me .sender-name { display: none; }

        .message { 
            padding: 8px 12px; border-radius: 12px; position: relative; 
            word-break: break-word; font-size: 0.95rem; line-height: 1.4; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); cursor: pointer;
        }
        .message-wrapper.me .message { background: var(--wa-bubble-out); border-top-right-radius: 0; }
        .message-wrapper.other .message { background: var(--wa-bubble-in); border-top-left-radius: 0; }
        
        /* Reply Box dalam Chat */
        .quoted-box {
            background: rgba(0, 0, 0, 0.2); border-left: 4px solid var(--primary);
            padding: 6px 10px; border-radius: 6px; margin-bottom: 6px;
            font-size: 0.85rem; color: #d1d7db; cursor: pointer;
        }
        .quoted-box strong { color: var(--primary); display: block; margin-bottom: 2px; }

        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; cursor: zoom-in; }
        .message audio { width: 100%; max-width: 250px; height: 40px; margin-top: 5px; outline: none; }
        
        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 4px; }
        .timestamp { font-size: 0.65rem; color: var(--text-muted); }
        .btn-delete { background: none; border: none; fill: var(--text-muted); cursor: pointer; padding: 2px; display: flex; align-items: center; }
        .btn-delete:hover { fill: var(--danger); }
        .message-wrapper.other .btn-delete { display: none; }

        /* Input Area & Reply Preview */
        .footer-container { display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; background: var(--wa-header); }
        
        .reply-preview {
            background: #111b21; border-left: 4px solid var(--primary);
            padding: 8px 12px; margin: 5px 10px 0 10px; border-radius: 8px;
            display: none; justify-content: space-between; align-items: center; font-size: 0.85rem;
        }
        .reply-preview span.close-reply { cursor: pointer; font-size: 1.2rem; color: var(--text-muted); padding: 5px; }

        .input-area { padding: 8px 10px; display: flex; align-items: center; gap: 8px; min-height: 60px; }
        .icon-btn { background: none; border: none; fill: var(--text-muted); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
        .input-wrapper { flex: 1; background: #2a3942; border-radius: 24px; display: flex; align-items: center; padding: 0 15px; }
        input[type="text"] { width: 100%; background: transparent; border: none; padding: 12px 0; color: var(--text-main); font-size: 1rem; outline: none; }
        #fileInput { display: none; }

        /* Voice Recording UI */
        #recording-ui { display: none; flex: 1; align-items: center; justify-content: space-between; background: #2a3942; border-radius: 24px; padding: 0 15px; height: 44px; }
        .rec-controls { display: flex; gap: 10px; align-items: center; }
        .rec-btn { background: none; border: none; fill: var(--danger); cursor: pointer; padding: 5px; display: flex; align-items: center; }
        .rec-btn.pause { fill: var(--text-main); }
        canvas { width: 100px; height: 30px; }
        #rec-timer { font-size: 0.9rem; font-variant-numeric: tabular-nums; color: var(--danger); }

        /* Modals & Fullscreen Image */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 20000; padding: 20px; }
        .modal-box { background: var(--wa-header); border-radius: 12px; width: 100%; max-width: 350px; padding: 20px; display: flex; flex-direction: column; }
        .user-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 60vh; }
        .user-item { background: #2a3942; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .user-item:hover { background: #32434d; }
        
        .img-fullscreen { max-width: 100%; max-height: 80vh; border-radius: 8px; object-fit: contain; }
        .close-fullscreen { position: absolute; top: 20px; right: 20px; font-size: 30px; color: white; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        /* Video Call Screen (ZUX Modern UI) */
        #video-screen { position: fixed; inset: 0; background: #111b21; z-index: 30000; display: none; flex-direction: column; justify-content: space-between; padding-bottom: 30px; }
        .video-container { flex: 1; position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 100px; height: 150px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 12px; border: 2px solid #00a884; background: #222; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .video-placeholder { position: absolute; color: var(--text-muted); font-size: 1.2rem; display: none; flex-direction: column; align-items: center; gap: 10px; }
        
        .video-controls { display: flex; justify-content: center; gap: 20px; background: var(--wa-header); padding: 15px 30px; border-radius: 40px; margin: 0 auto; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-call { width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; fill: white; font-size: 24px; background: #2a3942; transition: 0.3s; }
        .btn-call.active { background: #455a64; fill: #aebac1; }
        .btn-accept { background: var(--primary); }
        .btn-reject { background: var(--danger); }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- Layar Login -->
<div id="login-screen">
    <div class="login-box">
        <h2 style="margin:0 0 10px 0; color: var(--primary);">ZUX OFFICIAL</h2>
        <p style="margin:0 0 20px 0; font-size:0.85rem; color: var(--text-muted);">Masukkan username untuk masuk</p>
        <input type="text" id="usernameInput" placeholder="Username Anda..." autocomplete="off">
        <button onclick="masukApp()">MASUK CHAT</button>
    </div>
</div>

<!-- Main App Screen -->
<div id="app-screen">
    <header>
        <div class="header-left">
            <div class="hamburger"><div></div><div></div><div></div></div>
            <div class="title">ZUX OFFICIAL</div>
        </div>
        <div class="header-icons">
            <!-- IKON PANGGILAN VIDEO -->
            <button class="icon-btn-head" onclick="bukaDaftarUser()" title="Panggil Video">
                <svg width="26" height="26" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
        </div>
    </header>

    <div id="chat-container"></div>

    <div class="footer-container">
        <!-- Reply Preview -->
        <div class="reply-preview" id="replyPreview">
            <div>
                <strong style="color: var(--primary); display:block; margin-bottom:2px;" id="replySender"></strong>
                <span id="replyText" style="color: var(--text-muted);"></span>
            </div>
            <span class="close-reply" onclick="batalReply()">✕</span>
        </div>

        <div class="input-area">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Kirim Gambar">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" onchange="kirimGambar(event)">

            <div class="input-wrapper" id="text-ui">
                <input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off">
            </div>

            <!-- Voice Record UI -->
            <div id="recording-ui">
                <div class="rec-controls">
                    <button class="rec-btn" onclick="batalRekam()" title="Hapus"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                    <button class="rec-btn pause" id="pauseBtn" onclick="jedaRekam()" title="Jeda"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
                </div>
                <canvas id="visualizer"></canvas>
                <span id="rec-timer">00:00</span>
            </div>

            <button class="icon-btn" id="voiceBtn" onclick="mulaiRekam()" title="Kirim Voice Note">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>
            <button class="icon-btn" id="sendBtn" onclick="prosesKirim()" style="display:none; fill: var(--primary);" title="Kirim">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Modal Zoom Gambar -->
<div class="modal-overlay" id="imageModal" onclick="tutupImageModal()">
    <span class="close-fullscreen">✕</span>
    <img id="expandedImg" class="img-fullscreen" src="" alt="Perbesar">
</div>

<!-- Modal Panggil User -->
<div class="modal-overlay" id="userListModal">
    <div class="modal-box">
        <h3 style="margin:0 0 15px 0; color:var(--text-main);">Pilih Kontak Panggilan</h3>
        <div class="user-list" id="userListContainer"></div>
        <button onclick="document.getElementById('userListModal').style.display='none'" style="margin-top:15px; padding:12px; background:#333; color:white; border:none; border-radius:8px; cursor:pointer;">Tutup</button>
    </div>
</div>

<!-- Modal Panggilan Masuk -->
<div class="modal-overlay" id="incomingCallModal">
    <div class="modal-box" style="text-align: center;">
        <h3 id="callerName" style="margin:0 0 10px 0;">Panggilan Masuk...</h3>
        <p style="margin:0; color:var(--text-muted);">Panggilan Video ZUX</p>
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 25px;">
            <button class="btn-call btn-accept" onclick="terimaPanggilan()">
                <svg width="28" height="28" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <button class="btn-call btn-reject" onclick="tolakPanggilan()">
                <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Layar Video Call -->
<div id="video-screen">
    <div style="text-align: center; padding-top: 20px; flex-shrink: 0;">
        <h3 id="vc-target-name" style="margin:0; font-weight: 500;">ZUX Call</h3>
        <small style="color: var(--primary);">Terhubung Terenkripsi</small>
    </div>
    
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-placeholder" id="videoPlaceholder">
            <svg width="50" height="50" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .89-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg>
            Kamera Dinonaktifkan
        </div>
    </div>

    <div class="video-controls">
        <button class="btn-call" id="btnMuteAudio" onclick="toggleAudio()" title="Bisu Suara">🎤</button>
        <button class="btn-call" id="btnPauseVideo" onclick="toggleVideo()" title="Jeda Kamera">📷</button>
        <button class="btn-call btn-reject" onclick="matikanPanggilan()" title="Tutup Panggilan">
            <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
    </div>
</div>

<script>
    // 1. Inisialisasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0",
        authDomain: "kodangz.firebaseapp.com",
        databaseURL: "https://kodangz-default-rtdb.firebaseio.com",
        projectId: "kodangz",
        storageBucket: "kodangz.firebasestorage.app"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    let myUsername = localStorage.getItem('zux_username');

    window.onload = () => { 
        if (myUsername) { document.getElementById('usernameInput').value = myUsername; inisialisasi(); }
    };

    function masukApp() {
        const inputName = document.getElementById('usernameInput').value.trim();
        if (!inputName) return alert("Username Wajib Diisi!");
        localStorage.setItem('zux_username', inputName);
        myUsername = inputName;
        inisialisasi();
    }

    function inisialisasi() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        db.ref('users/' + myUsername).set({ status: 'online', last_seen: Date.now() });
        db.ref('users/' + myUsername).onDisconnect().remove();
        muatChat();
        dengarkanPanggilanMasuk();
    }

    // 2. Fitur Reply & Zoom Modal
    let dataReply = null;
    function siapkanReply(pengirim, teks, event) {
        event.stopPropagation(); // Cegah fungsi lain berjalan bersamaan
        dataReply = { pengirim, teks };
        document.getElementById('replySender').innerText = pengirim;
        document.getElementById('replyText').innerText = teks.substring(0, 50) + (teks.length > 50 ? '...' : '');
        document.getElementById('replyPreview').style.display = 'flex';
        document.getElementById('msgInput').focus();
    }
    function batalReply() {
        dataReply = null;
        document.getElementById('replyPreview').style.display = 'none';
    }
    
    function bukaZoomGambar(src, event) {
        event.stopPropagation();
        document.getElementById('expandedImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }
    function tutupImageModal() { document.getElementById('imageModal').style.display = 'none'; }

    // 3. Muat Chat & Kirim Pesan
    function formatWaktu(ts) {
        const d = new Date(ts);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }
    function hapusPesan(kunciPesan, event) {
        event.stopPropagation();
        if(confirm("Hapus pesan ini?")) db.ref('zux_chat/' + kunciPesan).remove();
    }

    function muatChat() {
        db.ref('zux_chat/').on('value', (snapshot) => {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const msg = data[key];
                    const isMe = msg.pengirim === myUsername ? 'me' : 'other';
                    let isiMsg = '', isiReply = '', onclickEvent = '';

                    // Jika pesan ini mereply pesan lain
                    if (msg.reply) {
                        isiReply = `<div class="quoted-box"><strong>${msg.reply.pengirim}</strong>${msg.reply.teks}</div>`;
                    }

                    if (msg.tipe === 'teks') {
                        isiMsg = `<span>${msg.isi}</span>`;
                        onclickEvent = `onclick="siapkanReply('${msg.pengirim}', '${msg.isi.replace(/'/g, "\\'")}', event)"`;
                    } else if (msg.tipe === 'gambar') {
                        isiMsg = `<img src="${msg.isi}" onclick="bukaZoomGambar('${msg.isi}', event)">`;
                        onclickEvent = `onclick="siapkanReply('${msg.pengirim}', '📸 Gambar', event)"`;
                    } else if (msg.tipe === 'suara') {
                        isiMsg = `<audio controls src="${msg.isi}"></audio>`;
                        onclickEvent = `onclick="siapkanReply('${msg.pengirim}', '🎤 Voice Note', event)"`;
                    }

                    container.innerHTML += `
                        <div class="message-wrapper ${isMe}" id="msg-${key}">
                            <div class="sender-name">${msg.pengirim}</div>
                            <div class="message" ${onclickEvent}>
                                ${isiReply}
                                ${isiMsg}
                                <div class="msg-footer">
                                    <button class="btn-delete" onclick="hapusPesan('${key}', event)" title="Hapus"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                                    <span class="timestamp">${formatWaktu(msg.waktu)}</span>
                                </div>
                            </div>
                        </div>`;
                });
                container.scrollTop = container.scrollHeight;
            }
        });
    }

    function prosesKirim() {
        if (isRecording || isPaused) berhentiDanKirimRekaman();
        else kirimTeks();
    }

    function kirimTeks() {
        const input = document.getElementById('msgInput');
        if (!input.value.trim()) return;
        const payload = { pengirim: myUsername, tipe: 'teks', isi: input.value, waktu: Date.now() };
        if (dataReply) { payload.reply = dataReply; }
        
        db.ref('zux_chat/').push(payload);
        input.value = '';
        batalReply();
        toggleSendBtn();
    }

    function kirimGambar(e) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            const payload = { pengirim: myUsername, tipe: 'gambar', isi: ev.target.result, waktu: Date.now() };
            if (dataReply) { payload.reply = dataReply; batalReply(); }
            db.ref('zux_chat/').push(payload);
        };
        r.readAsDataURL(file);
    }

    // Voice Note Code
    let mediaRecorder, audioChunks = [], isRecording = false, isPaused = false, isSending = false;
    let audioCtx, analyser, animationId, recTimerInterval, recSeconds = 0;
    const canvas = document.getElementById('visualizer'), canvasCtx = canvas.getContext('2d'), pauseBtnIcon = document.getElementById('pauseBtn');

    async function mulaiRekam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount, dataArray = new Uint8Array(bufferLength);

            function drawVisualizer() {
                animationId = requestAnimationFrame(drawVisualizer);
                analyser.getByteFrequencyData(dataArray);
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                let x = 0, barWidth = (canvas.width / bufferLength) * 2.5;
                for(let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i] / 2;
                    canvasCtx.fillStyle = 'rgb(0, 168, 132)';
                    canvasCtx.fillRect(x, canvas.height - barHeight/2, barWidth, barHeight/2);
                    x += barWidth + 1;
                }
            }
            drawVisualizer();

            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                cancelAnimationFrame(animationId); clearInterval(recTimerInterval);
                stream.getTracks().forEach(t => t.stop()); if(audioCtx.state !== 'closed') audioCtx.close();
                resetUI();
                if (audioChunks.length > 0 && isSending) {
                    const r = new FileReader();
                    r.onload = (ev) => {
                        const payload = { pengirim: myUsername, tipe: 'suara', isi: ev.target.result, waktu: Date.now() };
                        if (dataReply) { payload.reply = dataReply; batalReply(); }
                        db.ref('zux_chat/').push(payload);
                    };
                    r.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                }
                audioChunks = [];
            };
            mediaRecorder.start(); isRecording = true; isPaused = false; isSending = false;
            recSeconds = 0; document.getElementById('rec-timer').innerText = "00:00";
            recTimerInterval = setInterval(() => {
                recSeconds++;
                document.getElementById('rec-timer').innerText = String(Math.floor(recSeconds/60)).padStart(2,'0') + ':' + String(recSeconds%60).padStart(2,'0');
            }, 1000);
            document.getElementById('text-ui').style.display = 'none'; document.getElementById('voiceBtn').style.display = 'none';
            document.getElementById('recording-ui').style.display = 'flex'; document.getElementById('sendBtn').style.display = 'flex';
            pauseBtnIcon.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        } catch(e) { alert("Mikrofon Error"); }
    }
    function jedaRekam() {
        if(!mediaRecorder) return;
        if(isPaused) { mediaRecorder.resume(); audioCtx.resume(); isPaused=false; pauseBtnIcon.innerHTML=`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; }
        else { mediaRecorder.pause(); audioCtx.suspend(); isPaused=true; pauseBtnIcon.innerHTML=`<svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; }
    }
    function berhentiDanKirimRekaman() { if(mediaRecorder && mediaRecorder.state !== "inactive"){ isSending = true; mediaRecorder.stop(); } }
    function batalRekam() { if(mediaRecorder && mediaRecorder.state !== "inactive"){ isSending = false; audioChunks=[]; mediaRecorder.stop(); } }
    function resetUI() {
        isRecording = false; isPaused = false;
        document.getElementById('recording-ui').style.display = 'none'; document.getElementById('text-ui').style.display = 'flex'; toggleSendBtn();
    }
    
    const msgInput = document.getElementById('msgInput');
    function toggleSendBtn() {
        if(isRecording || isPaused) return;
        if(msgInput.value.trim().length > 0) { document.getElementById('voiceBtn').style.display='none'; document.getElementById('sendBtn').style.display='flex'; }
        else { document.getElementById('voiceBtn').style.display='flex'; document.getElementById('sendBtn').style.display='none'; }
    }
    msgInput.addEventListener('input', toggleSendBtn);
    msgInput.addEventListener('keypress', e => { if(e.key === 'Enter') kirimTeks(); });

    // 4. Video Call Engine (WebRTC + Firebase Signaling) + Bisu Suara & Jeda Kamera
    let pc, localStream, activeCallRef, currentCaller = "";
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function bukaDaftarUser() {
        document.getElementById('userListModal').style.display = 'flex';
        const listContainer = document.getElementById('userListContainer');
        listContainer.innerHTML = '<span style="color:var(--text-muted);">Memuat user...</span>';

        db.ref('users/').once('value', (snap) => {
            listContainer.innerHTML = '';
            const users = snap.val();
            if (users) {
                Object.keys(users).forEach(u => {
                    if (u !== myUsername) {
                        listContainer.innerHTML += `
                            <div class="user-item" onclick="panggilUser('${u}')">
                                <span style="font-weight:600;">${u}</span>
                                <span style="font-size:0.8rem; color:var(--primary);">Panggil 🎥</span>
                            </div>`;
                    }
                });
            }
            if (!listContainer.innerHTML) listContainer.innerHTML = '<div style="color:var(--text-muted); text-align:center;">Tidak ada user aktif</div>';
        });
    }

    async function panggilUser(targetUser) {
        document.getElementById('userListModal').style.display = 'none';
        document.getElementById('vc-target-name').innerText = targetUser;
        document.getElementById('video-screen').style.display = 'flex';
        resetVideoUI();

        activeCallRef = db.ref('calls/' + targetUser + '_' + myUsername);
        await persiapkanMedia();

        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
        pc.onicecandidate = e => { if (e.candidate) activeCallRef.child('offerCandidates').push(e.candidate.toJSON()); };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await activeCallRef.set({ pemanggil: myUsername, penerima: targetUser, offer: { type: offer.type, sdp: offer.sdp } });

        // Dengarkan Answer
        activeCallRef.child('answer').on('value', async snap => {
            const data = snap.val();
            if (data && !pc.currentRemoteDescription) { await pc.setRemoteDescription(new RTCSessionDescription(data)); }
        });
        activeCallRef.child('answerCandidates').on('child_added', snap => { pc.addIceCandidate(new RTCIceCandidate(snap.val())); });
    }

    function dengarkanPanggilanMasuk() {
        db.ref('calls/').on('child_added', snap => {
            const callData = snap.val();
            if (callData && callData.penerima === myUsername) {
                activeCallRef = snap.ref;
                currentCaller = callData.pemanggil;
                document.getElementById('callerName').innerText = currentCaller + " Memanggil...";
                document.getElementById('incomingCallModal').style.display = 'flex';
            }
        });
        // Deteksi jika panggilan dimatikan pihak lain
        db.ref('calls/').on('child_removed', snap => {
            if(activeCallRef && snap.key === activeCallRef.key) matikanPanggilanLokal();
        });
    }

    async function terimaPanggilan() {
        document.getElementById('incomingCallModal').style.display = 'none';
        document.getElementById('vc-target-name').innerText = currentCaller;
        document.getElementById('video-screen').style.display = 'flex';
        resetVideoUI();

        await persiapkanMedia();
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
        pc.onicecandidate = e => { if (e.candidate) activeCallRef.child('answerCandidates').push(e.candidate.toJSON()); };

        const callData = (await activeCallRef.once('value')).val();
        await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await activeCallRef.update({ answer: { type: answer.type, sdp: answer.sdp } });
        activeCallRef.child('offerCandidates').on('child_added', snap => { pc.addIceCandidate(new RTCIceCandidate(snap.val())); });
    }

    function tolakPanggilan() {
        document.getElementById('incomingCallModal').style.display = 'none';
        if (activeCallRef) activeCallRef.remove();
    }

    async function persiapkanMedia() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
        } catch(e) { alert("Izin Kamera/Mic Diperlukan!"); matikanPanggilan(); }
    }

    function toggleAudio() {
        if(!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if(audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('btnMuteAudio');
            if(audioTrack.enabled) { btn.classList.remove('active'); btn.innerText = '🎤'; }
            else { btn.classList.add('active'); btn.innerText = '🔇'; }
        }
    }

    function toggleVideo() {
        if(!localStream) return;
        const videoTrack = localStream.getVideoTracks()[0];
        if(videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            const btn = document.getElementById('btnPauseVideo');
            if(videoTrack.enabled) { 
                btn.classList.remove('active'); btn.innerText = '📷'; 
                document.getElementById('videoPlaceholder').style.display = 'none';
            } else { 
                btn.classList.add('active'); btn.innerText = '🚫'; 
                document.getElementById('videoPlaceholder').style.display = 'flex';
            }
        }
    }

    function resetVideoUI() {
        document.getElementById('btnMuteAudio').classList.remove('active');
        document.getElementById('btnMuteAudio').innerText = '🎤';
        document.getElementById('btnPauseVideo').classList.remove('active');
        document.getElementById('btnPauseVideo').innerText = '📷';
        document.getElementById('videoPlaceholder').style.display = 'none';
        document.getElementById('remoteVideo').srcObject = null;
    }

    function matikanPanggilan() {
        if (activeCallRef) activeCallRef.remove(); // Hapus dari DB, mentrigger child_removed di lawan
        matikanPanggilanLokal();
    }

    function matikanPanggilanLokal() {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (pc) pc.close();
        document.getElementById('video-screen').style.display = 'none';
        document.getElementById('incomingCallModal').style.display = 'none';
        activeCallRef = null;
    }
</script>
</body>
</html>
