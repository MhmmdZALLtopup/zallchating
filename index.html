<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZUX OFFICIAL - Global Chat & Call</title>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-header: #202c33;
            --wa-bubble-in: #202c33;
            --wa-bubble-out: #005c4b;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --primary: #00a884;
            --danger: #ea4335;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--wa-bg); color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Modal Login */
        #login-screen { position: fixed; inset: 0; background: var(--wa-bg); display: flex; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        .login-box { background: var(--wa-header); padding: 25px; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; outline: none; margin-bottom: 15px; font-size: 16px; background: #2a3942; color: white; text-align: center; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: #111b21; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Main Container */
        #app-screen { display: none; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

        /* Header Responsive */
        header { background: var(--wa-header); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 5px; }
        .hamburger div { width: 20px; height: 2px; background: var(--text-main); }
        .title { font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; }
        .header-icons { display: flex; gap: 15px; align-items: center; }
        .icon-btn-head { background: none; border: none; fill: var(--text-muted); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
        .icon-btn-head:hover { fill: var(--text-main); }

        /* Chat Container Responsive */
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 16px 16px; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        @media(min-width: 768px) { .message-wrapper { max-width: 65%; } }
        .message-wrapper.me { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }
        
        .sender-name { font-size: 0.75rem; color: var(--primary); margin-bottom: 2px; margin-left: 4px; font-weight: 600; }
        .message-wrapper.me .sender-name { display: none; }

        .message { padding: 8px 12px; border-radius: 10px; position: relative; word-break: break-word; font-size: 0.95rem; line-height: 1.4; }
        .message-wrapper.me .message { background: var(--wa-bubble-out); border-top-right-radius: 0; }
        .message-wrapper.other .message { background: var(--wa-bubble-in); border-top-left-radius: 0; }
        
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .message audio { width: 100%; max-width: 250px; height: 40px; margin-top: 5px; }
        .timestamp { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; display: block; }

        /* Input Area Full Icons */
        .input-area { background: var(--wa-header); padding: 8px 10px; display: flex; align-items: center; gap: 8px; min-height: 60px; }
        .icon-btn { background: none; border: none; fill: var(--text-muted); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; shrink: 0; }
        .icon-btn:hover { background: rgba(255,255,255,0.05); }
        
        .input-wrapper { flex: 1; background: #2a3942; border-radius: 20px; display: flex; align-items: center; padding: 0 15px; }
        input[type="text"] { width: 100%; background: transparent; border: none; padding: 10px 0; color: var(--text-main); font-size: 0.95rem; outline: none; }
        
        #fileInput { display: none; }
        #recording-indicator { display: none; color: var(--danger); font-size: 0.85rem; font-weight: 600; align-items: center; gap: 6px; flex: 1; }

        /* Modals & Overlays (User List, Incoming Call, Video Screen) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 20000; padding: 20px; }
        .modal-box { background: var(--wa-header); border-radius: 12px; width: 100%; max-width: 400px; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; }
        .user-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .user-item { background: #2a3942; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .user-item:hover { background: var(--primary); color: #111b21; }

        /* Incoming Call Box */
        .call-box { text-align: center; }
        .call-actions { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }
        .btn-call { width: 60px; height: 60px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; fill: white; }
        .btn-accept { background: var(--primary); }
        .btn-reject { background: var(--danger); }

        /* Video Call Screen */
        #video-screen { position: fixed; inset: 0; background: #000; z-index: 30000; display: none; flex-direction: column; }
        .video-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 100px; height: 150px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid white; background: #222; }
        .video-controls { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; }
    </style>

    <!-- Firebase Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- 1. Layar Login -->
<div id="login-screen">
    <div class="login-box">
        <h2 style="margin:0 0 10px 0; color: var(--primary);">ZUX OFFICIAL</h2>
        <p style="margin:0 0 20px 0; font-size:0.85rem; color: var(--text-muted);">Masukkan username untuk masuk</p>
        <input type="text" id="usernameInput" placeholder="Username Anda..." autocomplete="off">
        <button onclick="masukApp()">MASUK CHAT</button>
    </div>
</div>

<!-- 2. Main App Screen -->
<div id="app-screen">
    <header>
        <div class="header-left">
            <div class="hamburger"><div></div><div></div><div></div></div>
            <div class="title">ZUX OFFICIAL</div>
        </div>
        <div class="header-icons">
            <button class="icon-btn-head" onclick="bukaDaftarUser()" title="Panggil Video">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
        </div>
    </header>

    <div id="chat-container"></div>

    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Kirim Gambar">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" onchange="kirimGambar(event)">

        <div class="input-wrapper">
            <div id="recording-indicator">🔴 Merekam Suara...</div>
            <input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off">
        </div>

        <button class="icon-btn" id="voiceBtn" onmousedown="mulaiRekam()" onmouseup="stopRekam()" title="Tahan Mic">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>

        <button class="icon-btn" id="sendBtn" onclick="kirimTeks()" style="display:none; fill: var(--primary);" title="Kirim">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<!-- Modal Daftar User untuk VC -->
<div class="modal-overlay" id="userListModal">
    <div class="modal-box">
        <h3 style="margin:0; color:var(--text-main);">Pilih User untuk Video Call</h3>
        <div class="user-list" id="userListContainer"></div>
        <button onclick="tutupModal('userListModal')" style="margin-top:15px; padding:10px; background:#333; color:white; border:none; border-radius:6px; cursor:pointer;">Batal</button>
    </div>
</div>

<!-- Modal Panggilan Masuk (Incoming Call) -->
<div class="modal-overlay" id="incomingCallModal">
    <div class="modal-box call-box">
        <h3 id="callerName" style="margin:0 0 10px 0;">Seseorang Memanggil...</h3>
        <p style="margin:0; color:var(--text-muted);">Panggilan Video Masuk</p>
        <div class="call-actions">
            <button class="btn-call btn-accept" onclick="terimaPanggilan()" title="Angkat">
                <svg width="28" height="28" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <button class="btn-call btn-reject" onclick="tolakPanggilan()" title="Tolak">
                <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Layar Fullscreen Video Call -->
<div id="video-screen">
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-controls">
            <button class="btn-call btn-reject" onclick="matikanPanggilan()" title="Tutup Panggilan">
                <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    // 1. Inisialisasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyD3usv5rw801fV1nrXIwyDQ6eYEzC7hDk0",
        authDomain: "kodangz.firebaseapp.com",
        databaseURL: "https://kodangz-default-rtdb.firebaseio.com",
        projectId: "kodangz",
        storageBucket: "kodangz.firebasestorage.app",
        messagingSenderId: "306989473099",
        appId: "1:306989473099:web:9049d3135ce13e08a8dcce"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myUsername = localStorage.getItem('zux_username');

    // 2. Login & Pendaftaran User Online
    function masukApp() {
        const inputName = document.getElementById('usernameInput').value.trim();
        if (!inputName) return alert("Username Wajib Diisi!");
        
        localStorage.setItem('zux_username', inputName);
        myUsername = inputName;
        inisialisasi();
    }

    function inisialisasi() {
        if (myUsername) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            // Register ke daftar user online
            db.ref('users/' + myUsername).set({ status: 'online', last_seen: Date.now() });
            db.ref('users/' + myUsername).onDisconnect().remove();

            muatChat();
            dengarkanPanggilanMasuk();
        }
    }

    // 3. Chat Logic
    function formatWaktu(ts) {
        const d = new Date(ts);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function muatChat() {
        db.ref('zux_chat/').on('value', (snapshot) => {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(msg => {
                    const isMe = msg.pengirim === myUsername ? 'me' : 'other';
                    let isiMsg = '';

                    if (msg.tipe === 'teks') isiMsg = `<span>${msg.isi}</span>`;
                    else if (msg.tipe === 'gambar') isiMsg = `<img src="${msg.isi}">`;
                    else if (msg.tipe === 'suara') isiMsg = `<audio controls src="${msg.isi}"></audio>`;

                    container.innerHTML += `
                        <div class="message-wrapper ${isMe}">
                            <div class="sender-name">${msg.pengirim}</div>
                            <div class="message">${isiMsg}<span class="timestamp">${formatWaktu(msg.waktu)}</span></div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            }
        });
    }

    function kirimTeks() {
        const input = document.getElementById('msgInput');
        if (!input.value.trim()) return;
        db.ref('zux_chat/').push({ pengirim: myUsername, tipe: 'teks', isi: input.value, waktu: Date.now() });
        input.value = '';
        toggleSendBtn();
    }

    function kirimGambar(e) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            db.ref('zux_chat/').push({ pengirim: myUsername, tipe: 'gambar', isi: ev.target.result, waktu: Date.now() });
        };
        r.readAsDataURL(file);
    }

    // Voice Note
    let mediaRecorder, audioChunks = [];
    async function mulaiRekam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const r = new FileReader();
                r.onload = (ev) => {
                    db.ref('zux_chat/').push({ pengirim: myUsername, tipe: 'suara', isi: ev.target.result, waktu: Date.now() });
                };
                r.readAsDataURL(blob);
                audioChunks = [];
            };
            mediaRecorder.start();
            document.getElementById('recording-indicator').style.display = 'flex';
            document.getElementById('msgInput').style.display = 'none';
        } catch(e) { alert("Mikrofon Ditolak/Tidak Ada"); }
    }

    function stopRekam() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            document.getElementById('recording-indicator').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
        }
    }

    // 4. WebRTC Video Call Engine (Sistem Panggilan & Sinyal Realtime)
    let pc, localStream, activeCallRef, currentCaller = "";
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function bukaDaftarUser() {
        document.getElementById('userListModal').style.display = 'flex';
        const listContainer = document.getElementById('userListContainer');
        listContainer.innerHTML = 'Memuat user...';

        db.ref('users/').once('value', (snap) => {
            listContainer.innerHTML = '';
            const users = snap.val();
            if (users) {
                Object.keys(users).forEach(u => {
                    if (u !== myUsername) {
                        listContainer.innerHTML += `
                            <div class="user-item" onclick="panggilUser('${u}')">
                                <span>${u}</span>
                                <span style="font-size:0.8rem; color:var(--primary);">Panggil 🎥</span>
                            </div>
                        `;
                    }
                });
            }
            if (!listContainer.innerHTML) listContainer.innerHTML = '<div style="color:var(--text-muted);">Tidak ada user lain aktif</div>';
        });
    }

    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    async function panggilUser(targetUser) {
        tutupModal('userListModal');
        alert("Memanggil " + targetUser + "...");
        
        activeCallRef = db.ref('calls/' + targetUser + '_' + myUsername);
        await persiapkanMedia();

        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
        pc.onicecandidate = e => { if (e.candidate) activeCallRef.child('offerCandidates').push(e.candidate.toJSON()); };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await activeCallRef.set({
            pemanggil: myUsername,
            penerima: targetUser,
            offer: { type: offer.type, sdp: offer.sdp }
        });

        // Dengarkan Jawaban (Answer)
        activeCallRef.child('answer').on('value', async snap => {
            const data = snap.val();
            if (data && !pc.currentRemoteDescription) {
                document.getElementById('video-screen').style.display = 'flex';
                await pc.setRemoteDescription(new RTCSessionDescription(data));
            }
        });

        activeCallRef.child('answerCandidates').on('child_added', snap => {
            pc.addIceCandidate(new RTCIceCandidate(snap.val()));
        });
    }

    function dengarkanPanggilanMasuk() {
        db.ref('calls/').on('child_added', snap => {
            const callData = snap.val();
            if (callData && callData.penerima === myUsername) {
                activeCallRef = snap.ref;
                currentCaller = callData.pemanggil;
                document.getElementById('callerName').innerText = currentCaller + " Memanggil...";
                document.getElementById('incomingCallModal').style.display = 'flex';
            }
        });
    }

    async function terimaPanggilan() {
        tutupModal('incomingCallModal');
        document.getElementById('video-screen').style.display = 'flex';

        await persiapkanMedia();
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
        pc.onicecandidate = e => { if (e.candidate) activeCallRef.child('answerCandidates').push(e.candidate.toJSON()); };

        const callData = (await activeCallRef.once('value')).val();
        await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await activeCallRef.update({ answer: { type: answer.type, sdp: answer.sdp } });

        activeCallRef.child('offerCandidates').on('child_added', snap => {
            pc.addIceCandidate(new RTCIceCandidate(snap.val()));
        });
    }

    function tolakPanggilan() {
        tutupModal('incomingCallModal');
        if (activeCallRef) activeCallRef.remove();
    }

    async function persiapkanMedia() {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
    }

    function matikanPanggilan() {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (pc) pc.close();
        if (activeCallRef) activeCallRef.remove();
        document.getElementById('video-screen').style.display = 'none';
    }

    // UX Helpers
    const msgInput = document.getElementById('msgInput');
    function toggleSendBtn() {
        if (msgInput.value.trim().length > 0) {
            document.getElementById('voiceBtn').style.display = 'none';
            document.getElementById('sendBtn').style.display = 'flex';
        } else {
            document.getElementById('voiceBtn').style.display = 'flex';
            document.getElementById('sendBtn').style.display = 'none';
        }
    }
    msgInput.addEventListener('input', toggleSendBtn);
    msgInput.addEventListener('keypress', e => { if(e.key === 'Enter') kirimTeks(); });

    window.onload = () => { if (myUsername) inisialisasi(); };
</script>
</body>
</html>
