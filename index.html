<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - WA Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b141a;
            color: #e9edef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111b21;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Header */
        .chat-header {
            background-color: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #6b7c85;
        }

        .header-actions button {
            background: none;
            border: none;
            color: #aebac1;
            font-size: 20px;
            cursor: pointer;
            margin-left: 15px;
        }

        .header-actions button:hover {
            color: #00a884;
        }

        /* Body Chat */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(#1f2c34 1px, transparent 0);
            background-size: 15px 15px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            font-size: 14px;
            line-height: 1.4;
            cursor: pointer;
        }

        .message.received {
            background-color: #202c33;
            align-self: flex-start;
        }

        .message.sent {
            background-color: #005c4b;
            align-self: flex-end;
        }

        .quoted-box {
            background: rgba(0, 0, 0, 0.2);
            border-left: 4px solid #00a884;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 12px;
            color: #d1d7db;
        }

        .chat-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chat-img:hover {
            opacity: 0.9;
        }

        /* Footer & Input */
        .chat-footer {
            background-color: #202c33;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .reply-preview {
            background: #111b21;
            border-left: 4px solid #00a884;
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .reply-preview.hidden {
            display: none;
        }

        .input-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .input-box button {
            background: #00a884;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal Perbesar Gambar */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        /* Modal Video Call (WA Style) */
        .video-call-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111b21;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            z-index: 2000;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            color: #aebac1;
            font-size: 18px;
            display: none;
        }

        .call-controls {
            display: flex;
            gap: 15px;
            background: #202c33;
            padding: 12px 25px;
            border-radius: 30px;
        }

        .btn-call {
            background: #2a3942;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .btn-call.active {
            background: #f44336;
        }

        .btn-end {
            background: #ea0038;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header Chat -->
    <div class="chat-header">
        <div class="user-info">
            <div class="avatar"></div>
            <div>
                <strong>Kontak Official</strong><br>
                <small style="color: #8696a0;">Online</small>
            </div>
        </div>
        <div class="header-actions">
            <!-- Tombol Video Call -->
            <button onclick="startVideoCall()" title="Mulai Video Call">📹</button>
        </div>
    </div>

    <!-- Area Pesan -->
    <div class="chat-messages" id="chatMessages">
        <div class="message received" onclick="replyMessage('Kontak Official', 'Halo, selamat datang!')">
            Halo, selamat datang!
        </div>
        
        <div class="message received" onclick="replyMessage('Kontak Official', '[Gambar]')">
            Coba klik gambar di bawah untuk memperbesar:
            <br>
            <img src="https://picsum.photos/300/200" class="chat-img" onclick="openImageModal(this.src)" alt="Gambar Chat">
        </div>
    </div>

    <!-- Area Input & Reply Preview -->
    <div class="chat-footer">
        <div class="reply-preview hidden" id="replyPreview">
            <div>
                <small style="color: #00a884; font-weight: bold;" id="replySender"></small>
                <div id="replyText" style="color: #8696a0;"></div>
            </div>
            <span style="cursor: pointer;" onclick="cancelReply()">✕</span>
        </div>
        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Ketik pesan...">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>
</div>

<!-- Modal Zoom Gambar -->
<div class="image-modal" id="imageModal">
    <span class="close-btn" onclick="closeImageModal()">✕</span>
    <img id="expandedImg" src="" alt="Perbesar Gambar">
</div>

<!-- Modal Video Call -->
<div class="video-call-modal" id="videoCallModal">
    <h3 style="color: white; margin-top: 10px;">Panggilan Video</h3>
    
    <div class="video-wrapper">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-placeholder" id="videoPlaceholder">Kamera Dinonaktifkan</div>
    </div>

    <!-- Control Video Call -->
    <div class="call-controls">
        <button class="btn-call" id="btnMuteAudio" onclick="toggleAudio()" title="Mute Suara">🎤</button>
        <button class="btn-call" id="btnPauseVideo" onclick="toggleVideo()" title="Jeda Kamera">📷</button>
        <button class="btn-call btn-end" onclick="endVideoCall()" title="Akhiri Panggilan">📞</button>
    </div>
</div>

<script>
    /* ==========================================
       1. FITUR REPLY PESAN
    ========================================== */
    let currentReply = null;

    function replyMessage(sender, text) {
        currentReply = { sender, text };
        document.getElementById('replySender').innerText = sender;
        document.getElementById('replyText').innerText = text;
        document.getElementById('replyPreview').classList.remove('hidden');
    }

    function cancelReply() {
        currentReply = null;
        document.getElementById('replyPreview').classList.add('hidden');
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const chatMessages = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message sent';

        // Jika pesan ini membalas pesan lain
        if (currentReply) {
            const quoteDiv = document.createElement('div');
            quoteDiv.className = 'quoted-box';
            quoteDiv.innerHTML = `<strong>${currentReply.sender}</strong><br>${currentReply.text}`;
            msgDiv.appendChild(quoteDiv);
        }

        const textNode = document.createTextNode(text);
        msgDiv.appendChild(textNode);
        
        // Klik untuk reply pesan ini juga
        msgDiv.onclick = () => replyMessage('Anda', text);

        chatMessages.appendChild(msgDiv);
        input.value = '';
        cancelReply();
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    /* ==========================================
       2. FITUR PERBESAR GAMBAR (ZOOM MODAL)
    ========================================== */
    function openImageModal(src) {
        // Mencegah trigger event reply saat mengeklik gambar
        event.stopPropagation();
        document.getElementById('expandedImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }


    /* ==========================================
       3. FITUR VIDEO CALL (AUDIO, MUTE, JEDA KAMERA)
    ========================================== */
    let localStream = null;
    let isAudioMuted = false;
    let isVideoPaused = false;

    async function startVideoCall() {
        try {
            // Meminta akses ke kamera dan mikrofon secara nyata
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            const videoElem = document.getElementById('localVideo');
            videoElem.srcObject = localStream;
            
            // Unmute elemen audio internal video jika dibutuhkan
            videoElem.muted = false; 

            document.getElementById('videoCallModal').style.display = 'flex';
            resetCallUI();
        } catch (err) {
            alert('Gagal mengakses kamera/mikrofon: ' + err.message);
        }
    }

    function toggleAudio() {
        if (!localStream) return;

        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            isAudioMuted = !audioTrack.enabled;

            const btn = document.getElementById('btnMuteAudio');
            if (isAudioMuted) {
                btn.classList.add('active');
                btn.innerText = '🔇';
            } else {
                btn.classList.remove('active');
                btn.innerText = '🎤';
            }
        }
    }

    function toggleVideo() {
        if (!localStream) return;

        const videoTrack = localStream.getVideoTracks()[0];
        const placeholder = document.getElementById('videoPlaceholder');

        if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            isVideoPaused = !videoTrack.enabled;

            const btn = document.getElementById('btnPauseVideo');
            if (isVideoPaused) {
                btn.classList.add('active');
                btn.innerText = '🚫';
                placeholder.style.display = 'block';
            } else {
                btn.classList.remove('active');
                btn.innerText = '📷';
                placeholder.style.display = 'none';
            }
        }
    }

    function endVideoCall() {
        if (localStream) {
            // Matikan semua track kamera & audio
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        document.getElementById('videoCallModal').style.display = 'none';
    }

    function resetCallUI() {
        isAudioMuted = false;
        isVideoPaused = false;
        
        const btnMute = document.getElementById('btnMuteAudio');
        const btnVideo = document.getElementById('btnPauseVideo');
        
        btnMute.classList.remove('active');
        btnMute.innerText = '🎤';
        
        btnVideo.classList.remove('active');
        btnVideo.innerText = '📷';
        
        document.getElementById('videoPlaceholder').style.display = 'none';
    }
</script>
</body>
</html>
